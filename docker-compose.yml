# Levanta PostgreSQL + API Flask:  docker compose up --build
# Swagger: http://localhost:5000/api/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diapce
      POSTGRES_USER: diapce
      POSTGRES_PASSWORD: diapce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diapce -d diapce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://diapce:diapce@postgres:5432/diapce
      JWT_SECRET_KEY: cambia-esta-clave-en-produccion
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
